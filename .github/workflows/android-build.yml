name: Build Android APK

on:
  push:
    branches: [main]
    # Version tags (e.g. v1.0) trigger the signed release APK publish jobs
    # below, regardless of what files a given tagged commit touches — GitHub
    # applies `paths` to tag pushes too when both are present in the same
    # trigger, so this only reliably fires because the documented release
    # process (bump versionCode/versionName in app/build.gradle.kts, commit,
    # then tag) always touches a path this filter already matches.
    tags: ['v*']
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# Read-only by default; only the two publish jobs ask for more.
permissions:
  contents: read

# Third-party and first-party actions alike are pinned to full commit SHAs
# (with the tag as a comment): a tag can be moved to point at different code
# after the fact, a SHA can't.
#
# The jobs are split by trust: `build` runs all the npm/Gradle dependency
# code but never sees the signing key or a write token; `sign-release` sees
# the key but runs no repository or dependency code at all (just the Android
# SDK's own apksigner from the runner image); the publish jobs get a write
# token but no key. A compromised dependency or action therefore can't
# exfiltrate the release signing key.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the build if gradle/wrapper/gradle-wrapper.jar isn't a
      # genuine Gradle release (a swapped jar would run arbitrary code).
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # -PunsignedRelease: the release APK comes out unsigned (see
      # app/build.gradle.kts) and is signed by the sign-release job instead.
      # Still built on every run so the R8-minified shape gets smoke-tested.
      - name: Build debug APK and unsigned release APK
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease -PunsignedRelease --no-daemon

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-time-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The release APK's filename is world-time-v<versionName>.apk (set in
      # app/build.gradle.kts, not AGP's generic default), so it's matched by
      # glob here rather than hardcoded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-time-release-apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Re-signs the rolling debug APK with a stable, debug-only key (secret
  # ANDROID_DEBUG_KEYSTORE_BASE64 — see android/README.md) so each build
  # installs over the previous one. Otherwise every CI run signs with its
  # own freshly generated debug key and upgrades fail with
  # INSTALL_FAILED_UPDATE_INCOMPATIBLE. Same isolation as sign-release: no
  # checkout, no third-party actions. Without the secret the APK passes
  # through unchanged.
  sign-debug:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: world-time-debug-apk
          path: unsigned

      - name: Sign debug APK with the stable debug key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p signed
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set — publishing the debug APK signed with this run's throwaway key, so it won't install over the previous build (see android/README.md)."
            cp unsigned/app-debug.apk signed/
            exit 0
          fi
          build_tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/debug.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          # Android's standard debug-key credentials; the keystore itself is the secret.
          "$build_tools/zipalign" -f -p 4 unsigned/app-debug.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --v4-signing-enabled false \
            --out signed/app-debug.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" verify --print-certs signed/app-debug.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-time-debug-apk-signed
          path: signed/app-debug.apk
          if-no-files-found: error

  # Gives a stable URL that always points at the newest build from main,
  # instead of a per-run artifact link that expires after ~90 days.
  publish-debug:
    needs: sign-debug
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: world-time-debug-apk-signed

      - name: Publish to the rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<EOF
          Automatically rebuilt and replaced on every push to \`main\`
          (currently commit $GITHUB_SHA). This is a **debug build,
          not signed for distribution** — install directly, e.g.
          \`adb install -r app-debug.apk\` (if that fails with
          INSTALL_FAILED_UPDATE_INCOMPATIBLE, uninstall the previous debug
          build first).
          EOF
          )
          if gh release view android-debug-latest >/dev/null 2>&1; then
            gh release upload android-debug-latest app-debug.apk --clobber
            gh release edit android-debug-latest --notes "$notes" --prerelease --latest=false
          else
            gh release create android-debug-latest app-debug.apk \
              --title "Android (latest debug build)" --notes "$notes" \
              --prerelease --latest=false --target "$GITHUB_SHA"
          fi

  # World Time is distributed only via GitHub Releases (no Play Store), so
  # this signs an .apk, not an .aab. Deliberately no checkout and no
  # third-party actions: the only code that runs next to the key is the
  # runner image's own Android SDK build-tools. The `android-release`
  # environment lets the repo restrict these secrets (e.g. to v* tags, with
  # required reviewers) under Settings → Environments.
  sign-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: world-time-release-apk-unsigned
          path: unsigned

      - name: Sign release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Publishing an unsigned or debug-signed APK as "the" signed
          # release would be silently wrong, so fail loudly instead.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — refusing to publish an unsigned APK as the signed release for $GITHUB_REF. Add the ANDROID_KEYSTORE_* secrets first (see android/README.md)." >&2
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          mkdir -p signed
          for apk in unsigned/*.apk; do
            "$build_tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "signed/$(basename "$apk")" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" verify --print-certs "signed/$(basename "$apk")"
          done
          cd signed
          for apk in *.apk; do sha256sum "$apk" > "$apk.sha256"; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-time-release-apk
          path: signed/*
          if-no-files-found: error

  # Only for tagged releases — the debug APK above is already covered by the
  # rolling "latest" release, this is the signed build people actually install.
  publish-release:
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: world-time-release-apk
          path: signed

      # Build-provenance attestation: a Sigstore-signed statement, stored by
      # GitHub rather than on the release page, that this exact APK came out
      # of this workflow run on this commit. Unlike the .sha256 next to the
      # APK, someone who could replace the APK can't forge it. Verify with
      # `gh attestation verify <apk> -R <owner>/<repo>`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: signed/*.apk

      - name: Publish signed release APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<'EOF'
          Signed release build (not the debug build above) — this is the
          one to install. Before sideloading, you can check it really was
          built by this repository's CI from the tagged commit (needs the
          GitHub CLI):

          ```
          gh attestation verify world-time-v*.apk -R @REPO@
          ```

          The `.sha256` file only detects a corrupted download
          (`sha256sum -c world-time-v*.apk.sha256`) — it can't detect
          tampering, since it sits right next to the APK.
          EOF
          )
          notes=${notes//@REPO@/$GITHUB_REPOSITORY}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" signed/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" signed/* \
              --title "$GITHUB_REF_NAME" --notes "$notes" --verify-tag
          fi
